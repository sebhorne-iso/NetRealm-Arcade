<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404: Game Not Found</title>
  <script>
    // GitHub Pages serves this page for ANY missing URL, at any depth, so relative links won't work.
    // Work out the site root: /<repo>/ on <user>.github.io project sites, / on a custom domain.
    (function () {
      var seg = location.pathname.split('/')[1];
      var root = /\.github\.io$/i.test(location.hostname) && seg ? '/' + seg + '/' : '/';
      window.__ARCADE_ROOT__ = root;
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = root + 'shared/arcade.css';
      document.head.appendChild(link);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b0b1e; color: #f4f4ff; font-family: 'VT323', ui-monospace, monospace; font-size: 22px; text-align: center; padding: 20px; }
    .box { max-width: 560px; }
    h1 { font-family: 'Press Start 2P', ui-monospace, monospace; color: #ffd447; font-size: clamp(22px, 6vw, 40px); text-shadow: 4px 4px 0 #c0392b; line-height: 1.3; }
    .ghost { font-size: 64px; }
    a.home { display: inline-block; margin-top: 18px; font-family: 'Press Start 2P', ui-monospace, monospace; font-size: 11px; color: #fff; background: #f0802a; border: 3px solid #10102a; border-radius: 4px; padding: 12px 16px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="ghost" aria-hidden="true">👻</div>
    <h1>404<br>GAME NOT FOUND</h1>
    <p>This page dropped off the network. TTL exceeded, packet lost, route to host... nope.</p>
    <a class="home" id="home" href="/">◀ Back to the arcade</a>
  </div>
  <script>document.getElementById('home').href = window.__ARCADE_ROOT__ || '/';</script>
</body>
</html>
