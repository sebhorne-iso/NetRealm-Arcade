# Checks every pull request and every push to main: validates games.json, each game's folder
# and data, and runs all tests. (Deploying to GitHub Pages is done by jekyll-gh-pages.yml.)
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate catalog & games, run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate games.json and each game's data
        run: npm run validate
      - name: Unit tests (arcade tooling + every game's tests/)
        run: npm test
